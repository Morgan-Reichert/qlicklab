<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Administration • QlickLab</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/icon-black.png" />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,500&f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css?v=6" />
<style>
  .rail-sub.admin{color:var(--accent-deep)}
  .codecell{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.14em;
    background:var(--paper-2);padding:4px 10px;border-radius:8px;color:var(--ink)}
  .fld{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:#FCFCFB}
  .fld + .fld{margin-top:10px}
  .ansrow{padding:12px 0;border-bottom:1px solid var(--line)}
  .ansrow:last-child{border-bottom:0}
  .ansrow .q{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
  .ansrow .a{color:var(--ink);white-space:pre-wrap}
</style>
</head>
<body class="qlab">

<div class="shell">
  <aside class="rail">
    <div class="rail-head">
      <img class="rail-logo" src="assets/wordmark-black.png" alt="QlickLab" />
      <div class="rail-sub admin">Administration</div>
    </div>
    <nav class="rail-nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="xsmall faint">Connecté · équipe</div>
      <button class="btn btn-quiet btn-sm" id="btnOut" style="justify-content:flex-start;padding-left:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 21H5.5A1.5 1.5 0 0 1 4 19.5v-15A1.5 1.5 0 0 1 5.5 3H9"/><path d="M15.5 16.5 20 12l-4.5-4.5M20 12H9"/></svg>
        <span>Se déconnecter</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="burger-app" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="ttl">Tableau de bord</h1>
      <div class="grow"></div>
      <a class="btn btn-ghost btn-sm" href="index.html" target="_blank">Voir le site</a>
    </header>
    <div class="page" id="page">
      <div class="stack stack-14">
        <div class="skel" style="width:200px;height:22px"></div>
        <div class="skel" style="height:110px"></div>
        <div class="skel" style="height:240px"></div>
      </div>
    </div>
  </div>
</div>

<script src="qlab-config.js"></script>
<script src="app.js?v=6"></script>
<script>
(function () {
var $ = QL.$, $$ = QL.$$, esc = QL.esc, ico = QL.ico, T = QL.token;
if (!QL.guard('admin')) return;
QL.demoFlag();

var A = null;      /* données globales admin */
var VUES = [
  { id:'bord',      label:'Tableau de bord', icon:'chart' },
  { id:'clients',   label:'Clients',         icon:'users' },
  { id:'formulaires', label:'Formulaires',   icon:'form' },
  { id:'reglages',  label:'Réglages',        icon:'gear' }
];

function route() { var h = (location.hash || '').replace('#','').split('/')[0];
  return VUES.some(function (v) { return v.id === h; }) ? h : 'bord'; }
function sub() { return (location.hash || '').split('/')[1] || ''; }

function drawNav() {
  var cur = route();
  $('#nav').innerHTML = VUES.map(function (v) {
    var n = v.id === 'clients' && A ? A.clients.length : 0;
    return '<a class="rail-link' + (v.id === cur ? ' on' : '') + '" href="#' + v.id + '">'
      + ico(v.icon) + '<span>' + esc(v.label) + '</span>'
      + (n ? '<span class="pill">' + n + '</span>' : '') + '</a>';
  }).join('');
}

function load() {
  return QL.api('qb_admin_data', { p_token:T() }).then(function (d) {
    A = d; drawNav(); render();
  }).catch(function (e) {
    if (/session|refus/i.test(e.message)) { QL.setSession(null); location.replace('connexion.html'); return; }
    $('#page').innerHTML = '<div class="note bad">' + ico('alert') + '<span>' + esc(e.message) + '</span></div>';
  });
}
function render() {
  var v = route();
  $('#ttl').textContent = (VUES.filter(function (x) { return x.id === v; })[0] || {}).label;
  drawNav();
  ({ bord:vBord, clients:vClients, formulaires:vFormLib, reglages:vReglages })[v]();
}
window.addEventListener('hashchange', render);

/* ==================================================== Tableau de bord === */
function vBord() {
  var s = A.stats;
  var aVerifier = A.clients.filter(function (c) { return c.account_status === 'en_verification'; });
  var attente = A.clients.filter(function (c) { return c.account_status === 'attente_paiement'; });
  var recents = A.clients.slice().sort(function (a, b) {
    return (b.last_update || b.created_at).localeCompare(a.last_update || a.created_at); }).slice(0, 6);

  $('#page').innerHTML =
    '<div class="page-head"><h1>Vue d’ensemble</h1>'
    + '<p class="lede">L’état des dossiers en un coup d’œil.</p></div>'
    + '<div class="grid g4" style="margin-bottom:22px">'
      + kpi('Dossiers actifs', s.clients, 'espaces ouverts')
      + kpi('Demandes à vérifier', s.to_verify || 0, 'en attente de votre décision',
            (s.to_verify ? 'accent' : ''))
      + kpi('Formulaires ouverts', s.forms_waiting, 'chez les clients')
      + kpi('Réponses à examiner', s.to_review, 'formulaires envoyés', s.to_review ? 'accent' : '')
    + '</div>'

    + (aVerifier.length
      ? '<div class="card" style="margin-bottom:22px"><div class="card-head">'
        + '<h3>Demandes à vérifier</h3><span class="badge accent">' + aVerifier.length + '</span></div>'
        + '<div class="card-list">' + aVerifier.map(function (c) {
            return '<div class="row-between wrapfx" style="gap:14px">'
              + '<div class="grow" style="min-width:240px">'
              + '<a href="#clients/' + esc(c.id) + '" style="font-weight:600;color:var(--ink);font-size:15px">'
              + esc(c.business_name) + '</a>'
              + '<div class="small muted" style="margin-top:2px">' + esc(natLabel(c.project_nature))
              + ' · ' + esc(c.sector) + ' · ' + esc(QL.money(c.budget))
              + ' · ' + esc(c.contact_value) + '</div>'
              + '<div class="xsmall faint" style="margin-top:3px">Déposée ' + esc(QL.since(c.created_at))
              + (c.promo_code ? ' · code promo ' + esc(c.promo_code) : '') + '</div></div>'
              + '<div class="row" style="gap:8px">'
              + '<a class="btn btn-ghost btn-sm" href="#clients/' + esc(c.id) + '/fiche">Examiner</a>'
              + '<button class="btn btn-primary btn-sm" data-ok="' + esc(c.id) + '">Accepter</button>'
              + '</div></div>';
          }).join('') + '</div></div>'
      : '')

    + (attente.length
      ? '<div class="card" style="margin-bottom:22px"><div class="card-head"><h3>Acceptées, en attente de règlement</h3>'
        + '<span class="badge warn">' + attente.length + '</span></div><div class="card-list">'
        + attente.map(function (c) {
            return '<div class="row-between"><div><a href="#clients/' + esc(c.id) + '" style="font-weight:600;color:var(--ink)">'
              + esc(c.business_name) + '</a><div class="small muted">' + esc(QL.money(c.fee_amount))
              + ' · ouvert ' + esc(QL.since(c.created_at)) + ' · ' + esc(c.contact_value) + '</div></div>'
              + '<button class="btn btn-primary btn-sm" data-paid="' + esc(c.id) + '">Marquer réglé & activer</button></div>';
          }).join('') + '</div></div>'
      : '')

    + '<div class="card"><div class="card-head"><h3>Activité récente</h3>'
      + '<a class="btn btn-quiet btn-sm" href="#clients">Tous les clients</a></div>'
      + '<div class="tbl-wrap" style="padding:16px 22px 6px"><table class="tbl"><thead><tr>'
      + '<th>Client</th><th>Phase</th><th class="r">Formulaires</th><th class="r">Documents</th><th>Dernière nouvelle</th></tr></thead><tbody>'
      + recents.map(function (c) {
        var ph = QL.PHASES.filter(function (p) { return p.id === c.project_phase; })[0];
        return '<tr style="cursor:pointer" data-go="' + esc(c.id) + '">'
          + '<td><b style="color:var(--ink)">' + esc(c.business_name) + '</b>'
          + '<div class="xsmall faint">' + esc(natLabel(c.project_nature)) + '</div></td>'
          + '<td><span class="badge plain">' + esc(ph ? ph.label : '—') + '</span></td>'
          + '<td class="r">' + (c.forms_active ? '<span class="badge accent">' + c.forms_active + ' ouvert' + (c.forms_active > 1 ? 's' : '') + '</span>' : '<span class="faint">—</span>') + '</td>'
          + '<td class="r">' + (c.docs || '<span class="faint">—</span>') + '</td>'
          + '<td class="small muted">' + esc(c.last_update ? QL.since(c.last_update) : 'aucune') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';

  $$('[data-paid]').forEach(function (b) {
    b.onclick = function () {
      patch(b.dataset.paid, { fee_status:'regle', account_status:'actif' }, 'Dossier activé.');
    };
  });
  $$('[data-ok]').forEach(function (b) {
    b.onclick = function () { decider(b.dataset.ok, 'accept'); };
  });
  $$('[data-go]').forEach(function (r) { r.onclick = function () { location.hash = '#clients/' + r.dataset.go; }; });
}
function kpi(k, v, d, tone) {
  return '<div class="card kpi"><div class="k">' + esc(k) + '</div>'
    + '<div class="v"' + (tone === 'warn' ? ' style="color:var(--warn)"' : tone === 'accent' ? ' style="color:var(--accent-deep)"' : '') + '>'
    + v + '</div><div class="d">' + esc(d) + '</div></div>';
}
function natLabel(id) {
  var n = QL.NATURES.filter(function (x) { return x.id === id; })[0]; return n ? n.label : (id || '—');
}

/* ========================================================== Clients ===== */
function vClients() {
  var id = sub();
  if (id) return clientDetail(id);

  $('#page').innerHTML =
    '<div class="page-head row-between"><div><h1>Clients</h1>'
    + '<p class="lede">Tous les dossiers ouverts, actifs ou en attente.</p></div></div>'
    + '<div class="card" style="margin-bottom:16px"><div class="card-body" style="padding:14px 18px">'
      + '<input class="input" id="q" placeholder="Rechercher un nom, un secteur, un code…"></div></div>'
    + '<div class="card"><div class="tbl-wrap" style="padding:16px 22px 6px"><table class="tbl"><thead><tr>'
      + '<th>Client</th><th>Code</th><th>Secteur</th><th class="r">Budget</th><th>État</th><th>Phase</th><th></th>'
      + '</tr></thead><tbody id="rows"></tbody></table></div></div>';

  function rows(filtre) {
    var f = (filtre || '').toLowerCase();
    var list = A.clients.filter(function (c) {
      return !f || [c.business_name, c.sector, c.code, natLabel(c.project_nature)]
        .join(' ').toLowerCase().indexOf(f) >= 0;
    });
    $('#rows').innerHTML = list.length ? list.map(function (c) {
      var ph = QL.PHASES.filter(function (p) { return p.id === c.project_phase; })[0];
      var st = c.account_status === 'actif' ? '<span class="badge ok">Actif</span>'
        : c.account_status === 'attente_paiement' ? '<span class="badge warn">Paiement</span>'
        : '<span class="badge bad">Suspendu</span>';
      return '<tr data-go="' + esc(c.id) + '" style="cursor:pointer">'
        + '<td><b style="color:var(--ink)">' + esc(c.business_name) + '</b>'
        + '<div class="xsmall faint">' + esc(natLabel(c.project_nature)) + '</div></td>'
        + '<td><span class="codecell">' + esc(c.code) + '</span></td>'
        + '<td class="small">' + esc(c.sector) + '</td>'
        + '<td class="r num">' + esc(QL.money(c.budget)) + '</td>'
        + '<td>' + st + '</td>'
        + '<td><span class="badge plain">' + esc(ph ? ph.label : '—') + '</span></td>'
        + '<td class="r faint">' + ico('arrow') + '</td></tr>';
    }).join('') : '<tr><td colspan="7">' + vide('users', 'Aucun dossier', 'Aucun résultat pour cette recherche.') + '</td></tr>';
    $$('[data-go]').forEach(function (r) { r.onclick = function () { location.hash = '#clients/' + r.dataset.go; }; });
  }
  rows('');
  $('#q').oninput = QL.debounce(function () { rows($('#q').value); }, 180);
}

/* ---------------------------------------------------- Détail d'un client */
var CD = null;
function clientDetail(id) {
  $('#page').innerHTML = '<div class="skel" style="height:300px"></div>';
  QL.api('qb_admin_client', { p_token:T(), p_id:id }).then(function (d) {
    CD = d; paintClient();
  }).catch(function (e) { QL.toast(e.message, 'bad'); location.hash = '#clients'; });
}
function paintClient() {
  var c = CD.client;
  var onglet = (location.hash.split('/')[2]) || 'projet';
  var ETIQ = { actif:['ok','Actif'], en_verification:['accent','À vérifier'],
    attente_paiement:['warn','En attente de paiement'], refuse:['bad','Refusée'],
    suspendu:['bad','Suspendu'] };
  var e = ETIQ[c.account_status] || ['plain', c.account_status];
  var st = '<span class="badge ' + e[0] + '">' + e[1] + '</span>';

  $('#page').innerHTML =
    '<a class="btn btn-quiet btn-sm" href="#clients" style="margin-bottom:14px;padding-left:0">'
      + ico('back') + '<span>Tous les clients</span></a>'
    + '<div class="row-between wrapfx" style="margin-bottom:20px">'
      + '<div><div class="row" style="gap:10px"><h1>' + esc(c.business_name) + '</h1>' + st + '</div>'
      + '<p class="small muted" style="margin-top:6px">' + esc(natLabel(c.project_nature)) + ' · '
      + esc(c.sector) + ' · ' + esc(QL.money(c.budget)) + ' · ouvert le ' + esc(QL.dateFull(c.created_at)) + '</p></div>'
      + '<div class="row" style="gap:8px">'
        + '<span class="codecell">' + esc(c.code) + '</span>'
        + '<button class="btn btn-icon btn-ghost" id="cpyCode" title="Copier le code">' + ico('copy') + '</button>'
        + '<button class="btn btn-ghost btn-sm" id="regen">Nouveau code</button>'
      + '</div></div>'

    + (c.account_status === 'en_verification' ? bandeauVerif(c) : '')
    + '<div class="tabs">' + [['projet','Projet'],['forms','Formulaires'],['docs','Documents'],
        ['liens','Liens'],['maj','Mises à jour'],['fiche','Fiche']].map(function (t) {
        return '<a class="tab' + (onglet === t[0] ? ' on' : '') + '" href="#clients/' + esc(c.id) + '/' + t[0] + '">'
          + t[1] + '</a>'; }).join('') + '</div>'
    + '<div id="tabBody"></div>';

  $('#cpyCode').onclick = function () { QL.copier(c.code); };
  if ($('#vOk'))  $('#vOk').onclick  = function () { decider(c.id, 'accept', reloadClient); };
  if ($('#vNon')) $('#vNon').onclick = function () { decider(c.id, 'reject', reloadClient); };
  $('#regen').onclick = function () {
    QL.confirmer('Générer un nouveau code ?',
      'L’ancien code cessera immédiatement de fonctionner. Pensez à transmettre le nouveau au client.',
      function () {
        QL.api('qb_admin_code_regen', { p_token:T(), p_id:c.id }).then(function (r) {
          QL.toast('Nouveau code : ' + r.code, 'ok'); return reloadClient();
        }).catch(function (e) { QL.toast(e.message, 'bad'); });
      });
  };
  ({ projet:tProjet, forms:tForms, docs:tDocs, liens:tLiens, maj:tMaj, fiche:tFiche })[onglet]();
}
/* Tout ce que le client a déclaré, réuni pour décider sans naviguer. */
function bandeauVerif(c) {
  var ct = (QL.CONTACTS.filter(function (x) { return x.id === c.contact_method; })[0] || {}).label
           || c.contact_method;
  function ligne(k, v, large) {
    return '<div' + (large ? ' style="grid-column:1/-1"' : '') + '>'
      + '<div class="xsmall faint" style="letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:3px">'
      + esc(k) + '</div><div style="color:var(--ink);font-weight:500;white-space:pre-wrap">'
      + esc(v || '—') + '</div></div>';
  }
  return '<div class="card" style="margin-bottom:22px;border-color:var(--line-2)">'
    + '<div class="card-head" style="background:var(--accent-soft);border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom-color:#EBD3F2">'
      + '<div><h3 style="color:var(--accent-deep)">Demande à vérifier</h3>'
      + '<p class="small" style="color:var(--accent-deep);opacity:.85;margin-top:3px">'
      + 'Déposée ' + esc(QL.since(c.created_at)) + '. Le client patiente sur un écran d’attente.</p></div>'
      + '<div class="row" style="gap:8px">'
      + '<button class="btn btn-ghost btn-sm" id="vNon">Refuser</button>'
      + '<button class="btn btn-primary btn-sm" id="vOk">Accepter la demande</button></div></div>'
    + '<div class="card-body">'
      + '<div class="grid g2" style="gap:16px 22px">'
      + ligne('Nom de l’activité', c.business_name)
      + ligne('Secteur d’activité', c.sector)
      + ligne('Nature du projet', natLabel(c.project_nature))
      + ligne('Budget envisagé', QL.money(c.budget))
      + ligne('Moyen de contact', ct + ' · ' + c.contact_value)
      + ligne('Frais de dossier', (c.fee_amount ? QL.money(c.fee_amount) : 'Offerts')
          + (c.promo_code ? ' · code ' + c.promo_code : ''))
      + ligne('Conditions acceptées', QL.dateTime(c.cgu_accepted_at))
      + ligne('Code d’accès attribué', c.code)
      + (c.brief ? ligne('Besoin exprimé', c.brief, true) : '')
      + '</div>'
      + '<div class="note" style="margin-top:18px">' + ico('info')
      + '<span>À l’acceptation, l’espace s’ouvre immédiatement si les frais sont réglés ou offerts. '
      + 'Sinon le dossier passe en attente de règlement et le client en est informé.</span></div>'
    + '</div></div>';
}

function reloadClient() {
  return QL.api('qb_admin_client', { p_token:T(), p_id:CD.client.id })
    .then(function (d) { CD = d; paintClient(); return QL.api('qb_admin_data', { p_token:T() }); })
    .then(function (d) { A = d; drawNav(); });
}
/* Accepter ou refuser une demande. Le refus demande un motif : il s'affiche
   au client sur son écran d'attente. */
function decider(id, decision, apres) {
  if (decision === 'accept') {
    QL.api('qb_admin_review', { p_token:T(), p_id:id, p_decision:'accept', p_note:'' })
      .then(function (r) {
        QL.toast(r.account_status === 'actif'
          ? 'Espace ouvert au client.'
          : 'Demande acceptée — reste le règlement des frais.', 'ok');
        return apres ? apres() : load();
      }).catch(function (e) { QL.toast(e.message, 'bad'); });
    return;
  }
  QL.modal({ title:'Refuser cette demande', ok:'Refuser',
    sub:'Le motif sera affiché au client dans son espace.',
    body:'<div class="field"><label>Motif</label>'
      + '<textarea class="textarea" id="motif" placeholder="Ex. : le projet sort de notre champ d’intervention. Nous restons disponibles pour en parler."></textarea>'
      + '<p class="hint">Écrivez-le comme vous le diriez de vive voix.</p></div>',
    onOk:function (m) {
      var note = QL.$('#motif', m).value.trim();
      if (!note) { QL.toast('Un motif est nécessaire.', 'bad'); return false; }
      QL.api('qb_admin_review', { p_token:T(), p_id:id, p_decision:'reject', p_note:note })
        .then(function () { QL.toast('Demande refusée.', 'ok'); return apres ? apres() : load(); })
        .catch(function (e) { QL.toast(e.message, 'bad'); });
    } });
}

function patch(id, p, msg) {
  return QL.api('qb_admin_client_patch', { p_token:T(), p_id:id, p_patch:p })
    .then(function () { if (msg) QL.toast(msg, 'ok'); return load(); })
    .catch(function (e) { QL.toast(e.message, 'bad'); });
}

/* --- Onglet Projet --- */
function tProjet() {
  var c = CD.client;
  $('#tabBody').innerHTML =
    '<div class="grid g-side">'
    + '<div class="card"><div class="card-head"><h3>Fiche projet</h3>'
      + '<button class="btn btn-primary btn-sm" id="saveP">Enregistrer</button></div>'
      + '<div class="card-body stack stack-20">'
        + '<div class="field"><label for="pt">Titre affiché au client</label>'
          + '<input class="input" id="pt" value="' + esc(c.project_title || '') + '" placeholder="Espace de coordination…"></div>'
        + '<div class="field"><label for="ps">Résumé du projet</label>'
          + '<textarea class="textarea" id="ps" placeholder="Deux ou trois phrases, en français simple, sur ce que le projet apporte.">' + esc(c.summary || '') + '</textarea>'
          + '<p class="hint">Ce texte s’affiche en tête de l’espace client.</p></div>'
        + '<div class="grid g2">'
          + '<div class="field"><label for="pp">Phase</label><select class="select" id="pp">'
            + QL.PHASES.map(function (p) { return '<option value="' + p.id + '"'
              + (p.id === c.project_phase ? ' selected' : '') + '>' + esc(p.label) + '</option>'; }).join('')
            + '</select></div>'
          + '<div class="field"><label for="pg">Avancement · <span id="pgv" class="num">' + (c.progress || 0) + ' %</span></label>'
            + '<input class="range" type="range" id="pg" min="0" max="100" step="5" value="' + (c.progress || 0) + '"></div>'
        + '</div>'
        + '<div><div class="xsmall faint" style="letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:12px">Aperçu côté client</div>'
          + '<div id="phasePrev"></div></div>'
      + '</div></div>'
    + '<div class="stack" style="gap:16px">'
      + '<div class="card card-pad"><div class="xsmall faint" style="letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:10px">Notes internes</div>'
        + '<textarea class="textarea" id="notes" placeholder="Visible par vous seul.">' + esc(c.notes || '') + '</textarea>'
        + '<button class="btn btn-ghost btn-sm" id="saveN" style="margin-top:10px">Enregistrer la note</button></div>'

  var schema = f ? JSON.parse(JSON.stringify(f.schema)) : [];
  var m = QL.modal({ title:f ? 'Modifier le formulaire' : 'Nouveau formulaire', wide:true,
    ok:'Enregistrer',
    body:'<div class="stack stack-14">'
      + '<div class="field"><label>Titre</label><input class="input" id="ftTitle" value="' + esc(f ? f.title : '') + '" placeholder="Cadrage du besoin"></div>'

      + '<div><div class="row-between" style="margin-bottom:10px"><label class="lbl">Questions</label>'
      + '<button class="btn btn-ghost btn-sm" id="addFld">' + ico('plus') + '<span>Ajouter</span></button></div>'
      + '<div id="flds"></div></div></div>',
    onOk:function (mm) {
      var title = QL.$('#ftTitle', mm).value.trim();
      if (!title) { QL.toast('Le titre est obligatoire.', 'bad'); return false; }
      var out = collectFields(mm);
      if (!out.length) { QL.toast('Ajoutez au moins une question.', 'bad'); return false; }
      QL.api('qb_admin_form_upsert', { p_token:T(),
        p_form:{ id:f ? f.id : null, title:title, description:QL.$('#ftDesc', mm).value.trim(), schema:out } })
        .then(function () { QL.toast('Formulaire enregistré', 'ok'); return load(); })
        .catch(function (e) { QL.toast(e.message, 'bad'); });
    } });

  function drawFields() {
    QL.$('#flds', m.root).innerHTML = schema.map(function (fl, i) {
      return '<div class="fld" data-i="' + i + '">'
        + '<div class="row-between" style="margin-bottom:10px">'
          + '<span class="xsmall faint" style="font-weight:700;letter-spacing:.08em">QUESTION ' + (i + 1) + '</span>'
          + '<div class="row" style="gap:2px">'
          + (i > 0 ? '<button class="btn btn-icon btn-quiet" data-up="' + i + '">' + ico('up') + '</button>' : '')
          + (i < schema.length - 1 ? '<button class="btn btn-icon btn-quiet" data-down="' + i + '">' + ico('down') + '</button>' : '')
          + '<button class="btn btn-icon btn-danger" data-rm="' + i + '">' + ico('trash') + '</button></div></div>'
        + '<div class="stack stack-10">'
        + '<input class="input" data-p="label" placeholder="Intitulé de la question" value="' + esc(fl.label || '') + '">'
        + '<div class="row" style="gap:8px">'
          + '<select class="select" data-p="type" style="flex:1">' + TYPES.map(function (t) {
              return '<option value="' + t[0] + '"' + (fl.type === t[0] ? ' selected' : '') + '>' + t[1] + '</option>'; }).join('') + '</select>'
          + '<label class="check nowrap" style="align-items:center"><input type="checkbox" data-p="required"'
            + (fl.required ? ' checked' : '') + '><span class="small">Obligatoire</span></label></div>'
        + '<input class="input" data-p="help" placeholder="Précision affichée sous la question (facultatif)" value="' + esc(fl.help || '') + '">'
        + '<input class="input" data-p="options" placeholder="Choix possibles, séparés par une virgule" value="'
          + esc((fl.options || []).join(', ')) + '"' + (['select','radio','multi'].indexOf(fl.type) < 0 ? ' style="display:none"' : '') + '>'
        + '</div></div>';
    }).join('') || '<p class="small muted">Aucune question pour l’instant.</p>';

    QL.$$('[data-rm]', m.root).forEach(function (b) { b.onclick = function () {
      sync(); schema.splice(+b.dataset.rm, 1); drawFields(); }; });
    QL.$$('[data-up]', m.root).forEach(function (b) { b.onclick = function () {
      sync(); var i = +b.dataset.up; schema.splice(i - 1, 0, schema.splice(i, 1)[0]); drawFields(); }; });
    QL.$$('[data-down]', m.root).forEach(function (b) { b.onclick = function () {
      sync(); var i = +b.dataset.down; schema.splice(i + 1, 0, schema.splice(i, 1)[0]); drawFields(); }; });
    QL.$$('[data-p="type"]', m.root).forEach(function (s) { s.onchange = function () {
      var opt = QL.$('[data-p="options"]', s.closest('.fld'));
      opt.style.display = ['select','radio','multi'].indexOf(s.value) >= 0 ? '' : 'none'; }; });
  }
  function sync() { schema = collectFields(m.root, true); }
  function collectFields(scope, keepEmpty) {
    return QL.$$('.fld', scope).map(function (n) {
      var g = function (p) { return QL.$('[data-p="' + p + '"]', n); };
      var label = g('label').value.trim();
      return { key:'q' + (n.dataset.i || 0) + '_' + slug(label), label:label, type:g('type').value,
        required:g('required').checked, help:g('help').value.trim(),
        options:g('options').value.split(',').map(function (x) { return x.trim(); }).filter(Boolean) };
    }).filter(function (x) { return keepEmpty || x.label; });
  }
  function slug(s) {
    return (s || 'champ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0, 28) || 'champ';
  }
  QL.$('#addFld', m.root).onclick = function () {
    sync(); schema.push({ label:'', type:'text', required:false, help:'', options:[] }); drawFields();
  };
  drawFields();
}

/* ========================================================== Réglages ==== */
function vReglages() {
  var s = A.settings || {};
  $('#page').innerHTML =
    '<div class="page-head"><h1>Réglages</h1>'
    + '<p class="lede">Ce qui s’applique à toutes les nouvelles demandes.</p></div>'
    + '<div class="grid g-side">'
    + '<div class="card"><div class="card-head"><h3>Ouverture de dossier</h3>'
      + '<button class="btn btn-primary btn-sm" id="saveS">Enregistrer</button></div>'
      + '<div class="card-body stack stack-16">'
      + '<div class="field"><label for="sFee">Frais de dossier (€)</label>'
        + '<input class="input" type="number" id="sFee" value="' + (s.fee_amount || 0) + '" min="0">'
        + '<p class="hint">Mettez 0 pour ouvrir les dossiers gratuitement par défaut.</p></div>'
      + '<div class="field"><label for="sPay">Modalités de règlement affichées au client</label>'
        + '<textarea class="textarea" id="sPay" style="min-height:130px">' + esc(s.payment_instructions || '') + '</textarea>'
        + '<p class="hint">Ce texte apparaît à l’étape « Frais de dossier » et sur l’écran de confirmation.</p></div>'
      + '</div></div>'
    + '<div class="stack" style="gap:16px">'
      + '<div class="card card-pad"><div class="xsmall faint" style="letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:10px">Code promotionnel</div>'
        + '<p class="small muted">Un code d’exonération est actif. Il annule les frais de dossier et active '
        + 'immédiatement le compte du client. Il est vérifié côté serveur : il ne figure jamais dans le code du site.</p>'
        + '<p class="small muted" style="margin-top:10px">Pour le modifier, mettez à jour la table <span class="mono">qb_promo</span> dans Supabase.</p></div>'
      + '<div class="card card-pad"><div class="xsmall faint" style="letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:10px">Backend</div>'
        + '<div class="row" style="gap:9px"><span class="badge ' + (QL.LIVE ? 'ok' : 'warn') + '">'
        + (QL.LIVE ? 'Supabase connecté' : 'Non configuré') + '</span></div>'
        + '<p class="small muted" style="margin-top:10px">' + (QL.LIVE
          ? 'Données hébergées dans votre projet Supabase, région eu-central-1 (Francfort).'
          : 'Renseignez <span class="mono">qlab-config.js</span> pour brancher la base.') + '</p></div>'
    + '</div></div>';

  $('#saveS').onclick = function () {
    var b = this; QL.busy(b, true, 'Enregistrement…');
    QL.api('qb_admin_settings', { p_token:T(),
      p_patch:{ fee_amount:+$('#sFee').value, payment_instructions:$('#sPay').value.trim() } })
      .then(function () { QL.toast('Réglages enregistrés', 'ok'); return load(); })
      .catch(function (e) { QL.busy(b, false); QL.toast(e.message, 'bad'); });
  };
}

function vide(icon, titre, txt) {
  return '<div class="empty">' + ico(icon, 30) + '<b>' + esc(titre) + '</b><span>' + esc(txt) + '</span></div>';
}

$('#btnOut').onclick = function () { QL.logout(); };
QL.railToggle();
load();
})();
</script>
