<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page introuvable — QlickLab</title>
<link rel="icon" href="assets/icon-duo.png" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,500&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Satoshi',system-ui,sans-serif;background:#FAF6FC;color:#221327;min-height:100vh;
  display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(45% 40% at 15% 10%,rgba(166,47,189,.14),transparent 60%),
  radial-gradient(40% 35% at 88% 90%,rgba(249,115,22,.12),transparent 60%)}
.ap{width:110px;height:110px;margin:0 auto 28px;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:'Clash Display';font-size:clamp(64px,14vw,120px);line-height:1;
  background:linear-gradient(115deg,#A62FBD,#F97316);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:'Clash Display';font-weight:500;font-size:clamp(22px,4vw,30px);margin:6px 0 12px}
p{color:#6E6479;max-width:460px;margin:0 auto 30px;font-size:17px}
a.btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;color:#fff;
  background:linear-gradient(115deg,#A62FBD,#F97316);padding:15px 28px;border-radius:100px;
  box-shadow:0 14px 34px -12px rgba(166,47,189,.6);transition:transform .3s cubic-bezier(.22,1,.36,1)}
a.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div>
  <svg class="ap" viewBox="0 0 200 200" fill="none">
    <path d="M100 100 L100 12 A88 88 0 0 1 176 56 Z" fill="#A62FBD"/><path d="M100 100 L176 56 A88 88 0 0 1 176 144 Z" fill="#F97316"/><path d="M100 100 L176 144 A88 88 0 0 1 100 188 Z" fill="#A62FBD"/><path d="M100 100 L100 188 A88 88 0 0 1 24 144 Z" fill="#F97316"/><path d="M100 100 L24 144 A88 88 0 0 1 24 56 Z" fill="#A62FBD"/><path d="M100 100 L24 56 A88 88 0 0 1 100 12 Z" fill="#F97316"/>
    <circle cx="100" cy="100" r="38" fill="#FAF6FC"/>
  </svg>
  <h1>404</h1>
  <h2>Cette page a disparu de notre objectif.</h2>
  <p>Le lien est peut-être cassé, ou la page a été déplacée. Revenons à l'essentiel.</p>
  <a class="btn" href="/qlicklab/">Retour à l'accueil
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</div>
</body>
</html>
