<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page introuvable • QlickLab</title>
<link rel="icon" href="assets/icon-duo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --noir:#000; --violet:#A62FBD; --orange:#F97316; --gris-txt:#56575E;
  --titre:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --texte:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --degrade:linear-gradient(100deg,var(--violet) 0%,var(--orange) 100%);
}
body{font-family:var(--texte);background:#fff;color:var(--noir);min-height:100vh;
  display:grid;place-items:center;text-align:center;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(50% 44% at 12% 0%,rgba(166,47,189,.16),transparent 62%),
  radial-gradient(46% 40% at 90% 8%,rgba(249,115,22,.16),transparent 62%)}
.ap{width:96px;height:96px;margin:0 auto 28px}
h1{font-family:var(--titre);font-weight:800;font-size:clamp(64px,14vw,120px);line-height:1;
  letter-spacing:-.06em;background:var(--degrade);-webkit-background-clip:text;background-clip:text;color:transparent}
h1::before{content:"{\00A0";color:var(--violet);-webkit-text-fill-color:var(--violet)}
h1::after{content:"\00A0}";color:var(--orange);-webkit-text-fill-color:var(--orange)}
h2{font-family:var(--titre);font-weight:800;font-size:clamp(22px,4vw,30px);
  letter-spacing:-.04em;margin:10px 0 12px;text-wrap:balance}
p{color:var(--gris-txt);max-width:46ch;margin:0 auto 30px;font-size:17px}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font-family:var(--titre);font-weight:700;font-size:.95rem;font-variation-settings:"wdth" 92;
  min-height:54px;padding:0 2.1rem;border:2px solid var(--violet);border-radius:999px;
  background:var(--violet);color:#fff;text-decoration:none;
  box-shadow:0 12px 28px -12px rgba(166,47,189,.6);
  transition:background .16s,border-color .16s,transform .16s cubic-bezier(.2,.8,.3,1)}
a.btn:hover{background:var(--noir);border-color:var(--noir);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div>
  <img class="ap" src="assets/icon-duo.png?v=2" alt=""/>
  <h1>404</h1>
  <h2>Cette page a disparu de notre objectif.</h2>
  <p>Le lien est peut-être cassé, ou la page a été déplacée. Revenons à l'essentiel.</p>
  <a class="btn" href="/qlicklab/">Retour à l'accueil
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</div>
</body>
</html>
